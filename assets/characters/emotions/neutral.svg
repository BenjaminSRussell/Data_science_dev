<svg width="64" height="64" xmlns="http://www.w3.org/2000/svg">
  <!-- Neutral stick figure -->
  <!-- Head -->
  <circle cx="32" cy="12" r="6" fill="#808080" stroke="#000" stroke-width="1"/>
  <!-- Neutral eyes -->
  <circle cx="29" cy="11" r="1" fill="#000"/>
  <circle cx="35" cy="11" r="1" fill="#000"/>
  <!-- Neutral mouth -->
  <line x1="28" y1="15" x2="36" y2="15" stroke="#000" stroke-width="1.5"/>
  <!-- Body -->
  <line x1="32" y1="18" x2="32" y2="40" stroke="#333" stroke-width="2"/>
  <!-- Arms -->
  <line x1="32" y1="25" x2="22" y2="30" stroke="#333" stroke-width="2"/>
  <line x1="32" y1="25" x2="42" y2="30" stroke="#333" stroke-width="2"/>
  <!-- Legs -->
  <line x1="32" y1="40" x2="25" y2="50" stroke="#333" stroke-width="2"/>
  <line x1="32" y1="40" x2="39" y2="50" stroke="#333" stroke-width="2"/>
</svg>

