<svg width="64" height="64" xmlns="http://www.w3.org/2000/svg">
  <!-- Angry stick figure -->
  <!-- Head -->
  <circle cx="32" cy="12" r="6" fill="#FF4500" stroke="#000" stroke-width="1"/>
  <!-- Angry eyes -->
  <line x1="28" y1="10" x2="30" y2="12" stroke="#000" stroke-width="2"/>
  <line x1="34" y1="10" x2="36" y2="12" stroke="#000" stroke-width="2"/>
  <!-- Angry mouth -->
  <path d="M 27 15 Q 32 18 37 15" stroke="#000" stroke-width="1.5" fill="none"/>
  <!-- Body -->
  <line x1="32" y1="18" x2="32" y2="40" stroke="#333" stroke-width="2"/>
  <!-- Arms (fists) -->
  <line x1="32" y1="25" x2="20" y2="30" stroke="#333" stroke-width="2"/>
  <circle cx="20" cy="30" r="3" fill="#333"/>
  <line x1="32" y1="25" x2="44" y2="30" stroke="#333" stroke-width="2"/>
  <circle cx="44" cy="30" r="3" fill="#333"/>
  <!-- Legs -->
  <line x1="32" y1="40" x2="25" y2="50" stroke="#333" stroke-width="2"/>
  <line x1="32" y1="40" x2="39" y2="50" stroke="#333" stroke-width="2"/>
</svg>

