<svg width="64" height="64" xmlns="http://www.w3.org/2000/svg">
  <!-- Sad stick figure -->
  <!-- Head -->
  <circle cx="32" cy="12" r="6" fill="#4169E1" stroke="#000" stroke-width="1"/>
  <!-- Sad eyes -->
  <ellipse cx="29" cy="11" rx="1" ry="1.5" fill="#000"/>
  <ellipse cx="35" cy="11" rx="1" ry="1.5" fill="#000"/>
  <!-- Frown -->
  <path d="M 27 16 Q 32 13 37 16" stroke="#000" stroke-width="1.5" fill="none"/>
  <!-- Body -->
  <line x1="32" y1="18" x2="32" y2="40" stroke="#333" stroke-width="2"/>
  <!-- Arms (down) -->
  <line x1="32" y1="25" x2="25" y2="32" stroke="#333" stroke-width="2"/>
  <line x1="32" y1="25" x2="39" y2="32" stroke="#333" stroke-width="2"/>
  <!-- Legs -->
  <line x1="32" y1="40" x2="25" y2="50" stroke="#333" stroke-width="2"/>
  <line x1="32" y1="40" x2="39" y2="50" stroke="#333" stroke-width="2"/>
</svg>

