<!DOCTYPE html>
<html>
<head>
    <title>Game Load Test</title>
    <style>
        body { font-family: monospace; padding: 20px; background: #000; color: #0f0; }
        .status { margin: 10px 0; padding: 10px; border: 1px solid #0f0; }
        .error { color: #f00; border-color: #f00; }
        .success { color: #0f0; border-color: #0f0; }
    </style>
</head>
<body>
    <h1>Game Load Test</h1>
    <div id="status"></div>
    <script type="module">
        const status = document.getElementById('status');
        
        function addStatus(msg, type = 'info') {
            const div = document.createElement('div');
            div.className = `status ${type}`;
            div.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
            status.appendChild(div);
        }
        
        addStatus('✅ HTML loaded', 'success');
        
        try {
            addStatus('🔄 Attempting to import main.js...', 'info');
            const module = await import('/src/js/main.js');
            addStatus('✅ main.js module imported successfully!', 'success');
            addStatus(`✅ MainGame class available: ${typeof module.MainGame}`, 'success');
            
            // Wait a bit for initialization
            setTimeout(() => {
                if (window.game) {
                    addStatus('✅ window.game is available!', 'success');
                    addStatus('✅ Game should be loading...', 'success');
                } else {
                    addStatus('⚠️ window.game not yet available (may still be initializing)', 'error');
                }
            }, 2000);
        } catch (e) {
            addStatus(`❌ Failed to import main.js: ${e.message}`, 'error');
            addStatus(`Stack: ${e.stack}`, 'error');
        }
    </script>
</body>
</html>
