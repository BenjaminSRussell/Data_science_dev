<!DOCTYPE html>
<html>
<head><title>Simple Test</title></head>
<body>
    <h1 style="color:red;font-size:50px;">IF YOU SEE THIS, HTML IS LOADING</h1>
    <div id="test" style="font-size:30px;color:green;"></div>
    <script>
        document.getElementById('test').textContent = '✅ JavaScript is working!';
        console.log('✅ JavaScript executed');
    </script>
    <script type="module">
        console.log('✅ ES Module support confirmed');
        document.getElementById('test').textContent += ' ✅ ES Modules work!';
    </script>
</body>
</html>
